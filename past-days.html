<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>永逝的往日 | LoreBumoa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f6f6f6;
color:#111;
font-family:Helvetica, Arial, sans-serif;
animation:pageFadeIn 0.7s ease;
}

@keyframes pageFadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:34px 42px;
font-size:13px;
letter-spacing:1px;
z-index:10;
}

a{
color:#111;
text-decoration:none;
}

.nav-right button{
background:none;
border:none;
font-size:13px;
font-family:Helvetica, Arial, sans-serif;
cursor:pointer;
margin-left:24px;
color:#111;
}

.viewer{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:110px 40px 110px;
}

.photo-wrap{
max-width:980px;
width:100%;
text-align:center;
}

.photo-wrap img{
max-width:100%;
max-height:72vh;
object-fit:contain;
display:block;
margin:0 auto;
transition:opacity 0.45s ease;
}

.photo-wrap img.fade-out{
opacity:0;
}

.info{
position:fixed;
left:42px;
bottom:34px;
font-size:13px;
line-height:1.8;
letter-spacing:1px;
}

.title{
font-family:"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;
font-size:18px;
letter-spacing:3px;
}

.counter{
color:#666;
font-size:12px;
}

@media(max-width:700px){
header{
padding:24px;
}

.viewer{
padding:100px 20px 110px;
}

.info{
left:24px;
bottom:24px;
}

.photo-wrap img{
max-height:65vh;
}
}
</style>
</head>

<body>

<header>
<a href="works.html">Index</a>

<div class="nav-right">
<button onclick="prevPhoto()">Back</button>
<button onclick="nextPhoto()">Next</button>
</div>
</header>

<main class="viewer">
<div class="photo-wrap">
<img id="mainPhoto" src="images/past-days/001.jpg" alt="永逝的往日">
</div>
</main>

<div class="info">
<div class="title">永逝的往日</div>
<div>Past Days</div>
<div class="counter" id="counter">001 / 010</div>
</div>

<script>
const photos = [
  "images/past-days/001.jpg",
  "images/past-days/002.jpg",
  "images/past-days/003.jpg",
  "images/past-days/004.jpg",
  "images/past-days/005.jpg",
  "images/past-days/006.jpg",
  "images/past-days/007.jpg",
  "images/past-days/008.jpg",
  "images/past-days/009.jpg",
  "images/past-days/010.jpg"
];

let current = 0;

const img = document.getElementById("mainPhoto");
const counter = document.getElementById("counter");

function updatePhoto(){
  img.classList.add("fade-out");

  setTimeout(() => {
    img.src = photos[current];
    counter.textContent =
      String(current + 1).padStart(3, "0") +
      " / " +
      String(photos.length).padStart(3, "0");

    img.classList.remove("fade-out");
  }, 450);
}

function nextPhoto(){
  current = (current + 1) % photos.length;
  updatePhoto();
}

function prevPhoto(){
  current = (current - 1 + photos.length) % photos.length;
  updatePhoto();
}

document.addEventListener("keydown", function(event){
  if(event.key === "ArrowRight"){
    nextPhoto();
  }
  if(event.key === "ArrowLeft"){
    prevPhoto();
  }
});
</script>

</body>
</html>
