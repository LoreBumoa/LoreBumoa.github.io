<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Works | LoreBumoa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Helvetica, Arial, sans-serif;
background:#f5f5f5;
color:#111;
}

header{
display:flex;
justify-content:space-between;
padding:36px 42px;
font-size:14px;
letter-spacing:2px;
}

header a{
color:#111;
text-decoration:none;
margin-left:28px;
}

.title{
padding:120px 42px 80px;
font-size:18px;
letter-spacing:2px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:4px;
padding:0 4px 60px;
}

.work{
position:relative;
display:block;
height:220px;
overflow:hidden;
background:#ddd;
color:white;
text-decoration:none;
}

.work img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
}

.work:hover img{
transform:scale(1.04);
filter:brightness(70%);
}

.caption{
position:absolute;
left:18px;
bottom:16px;
font-size:14px;
letter-spacing:2px;
}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:500px){
.grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
<div>LoreBumoa</div>
<nav>
<a href="index.html">HOME</a>
<a href="about.html">ABOUT</a>
</nav>
</header>

<div class="title">WORKS</div>

<div class="grid">

<a class="work" href="tokyo.html">
<img src="cover.JPG">
<div class="caption">流光・東京</div>
</a>

<a class="work" href="#">
<img src="cover.JPG">
<div class="caption">千好万好，五光重庆</div>
</a>

<a class="work" href="#">
<img src="cover.JPG">
<div class="caption">Portrait</div>
</a>

<a class="work" href="#">
<img src="cover.JPG">
<div class="caption">小動物</div>
</a>

</div>

</body>
</html>
