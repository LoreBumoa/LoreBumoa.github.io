<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Works | LoreBumoa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Helvetica, Arial, sans-serif;
background:#f5f5f5;
color:#111;
}

header{
display:flex;
justify-content:space-between;
padding:36px 42px;
font-size:14px;
letter-spacing:2px;
}

header a{
color:#111;
text-decoration:none;
margin-left:28px;
}

.title{
padding:120px 42px 80px;
font-size:18px;
letter-spacing:2px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:4px;
padding:0 4px 60px;
}

.work{
position:relative;
display:block;
height:220px;
overflow:hidden;
background:#ddd;
color:white;
text-decoration:none;
}

.work img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
}

.work:hover img{
transform:scale(1.04);
filter:brightness(70%);
}

.caption{
position:absolute;
left:18px;
bottom:16px;
font-size:14px;
letter-spacing:2px;
line-height:1.5;
text-shadow:0 1px 8px rgba(0,0,0,0.35);
}

.caption span{
display:block;
margin-top:6px;
font-size:11px;
letter-spacing:1px;
opacity:0.85;
}

@media(max-width:900px){
.grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:500px){
.grid{
grid-template-columns:1fr;
}

header{
padding:28px 24px;
}

.title{
padding:90px 24px 60px;
}
}
</style>
</head>

<body>

<header>
<div>LoreBumoa</div>

<nav>
<a href="index.html">HOME</a>
<a href="about.html">ABOUT</a>
</nav>
</header>

<div class="title">WORKS</div>

<div class="grid">

<a class="work" href="past-days.html">
<img src="cover.JPG">
<div class="caption">
永逝的往日
<span>Past Days</span>
</div>
</a>

<a class="work" href="chongqing.html">
<img src="cover.JPG">
<div class="caption">
千好万好，五光重庆
<span>Chongqing</span>
</div>
</a>

<a class="work" href="unfinished-summer.html">
<img src="cover.JPG">
<div class="caption">
未完成の夏
<span>Unfinished Summer</span>
</div>
</a>

<a class="work" href="clod-prayer.html">
<img src="cover.JPG">
<div class="caption">
Clod Prayer
<span>冷祷 / Snow Mountain</span>
</div>
</a>

</div>

</body>
</html>
